version: '3.9'

services:
  # ── Infrastructure ───────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: videoforge-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: videoforge
    networks:
      - videoforge-net

  redis:
    image: redis:7-alpine
    container_name: videoforge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - videoforge-net

  # ── Optional: Bull Board (queue dashboard) ────────────────────
  bull-board:
    image: deadly0/bull-board
    container_name: videoforge-bull-board
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - videoforge-net

  # ── Optional: Mongo Express (dev DB UI) ───────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: videoforge-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_URL: mongodb://root:rootpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - videoforge-net

volumes:
  mongodb_data:
  redis_data:

networks:
  videoforge-net:
    driver: bridge
